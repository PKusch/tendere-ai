name: checks

# The leadership view's numbers are pinned in tests/test_engine.py. This runs
# them, and the whole demo offline, on every push, so a data edit that breaks
# the readiness count or lets a contrast role back into the gaps fails here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # The README says "Python 3, nothing to install", so the supported range is tested
    # rather than one version: 3.10 is the oldest still receiving fixes.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Demo runs offline
        run: python engine.py > /dev/null
      - name: No stale model name in the docs
        run: python scripts/check_model_name.py
